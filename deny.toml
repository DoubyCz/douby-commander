# cargo-deny: dependencies must have licenses compatible with
# GPL-2.0-or-later, no known security advisories, no unknown sources.
# Apache-2.0 is compatible with GPL-3.0 only; under "or later" the
# program as a whole is then distributed under GPL-3.0.

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
yanked = "deny"

[licenses]
allow = [
    "GPL-2.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "LGPL-2.1-or-later",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Our own crates are path dependencies of the workspace.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
