[package]
name = "dc-gui"
description = "Douby Commander, a two-panel file manager for Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "doubycmd"
path = "src/main.rs"

[dependencies]
dc-core.workspace = true
dc-i18n.workspace = true
dc-ops.workspace = true
dc-vfs.workspace = true
adw.workspace = true
gtk.workspace = true
jiff.workspace = true

[features]
# Builds against the GTK and libadwaita API of the system (4.22, 1.9), so
# that everything deprecated there shows up (`deprecated` is denied).
# Normal builds keep the 4.16 / 1.6 baseline. Used by check.sh.
gtk-latest = ["gtk/v4_22", "adw/v1_9"]

# Packages for the GitHub releases. Their files come from the staging tree
# that `DESTDIR=target/stage PREFIX=/usr ./install.sh --no-build` makes.
[package.metadata.deb]
name = "douby-commander"
maintainer = "Jiří Doubravský <douby@douby.cz>"
copyright = "Jiří Doubravský; icon and original design by the Double Commander authors"
extended-description = "Two-panel file manager for Linux in Rust and GTK 4, a tribute to Double Commander."
section = "utils"
depends = "$auto"
assets = [
    ["../../target/stage/usr/bin/doubycmd", "usr/bin/", "755"],
    ["../../target/stage/usr/share/applications/cz.douby.DoubyCommander.desktop", "usr/share/applications/", "644"],
    ["../../target/stage/usr/share/icons/hicolor/scalable/apps/cz.douby.DoubyCommander.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../target/stage/usr/share/locale/cs/LC_MESSAGES/doubycmd.mo", "usr/share/locale/cs/LC_MESSAGES/", "644"],
]

[package.metadata.generate-rpm]
name = "douby-commander"
summary = "Two-panel file manager, a tribute to Double Commander"
auto-req = "no"
assets = [
    { source = "../../target/stage/usr/bin/doubycmd", dest = "/usr/bin/doubycmd", mode = "755" },
    { source = "../../target/stage/usr/share/applications/cz.douby.DoubyCommander.desktop", dest = "/usr/share/applications/cz.douby.DoubyCommander.desktop", mode = "644" },
    { source = "../../target/stage/usr/share/icons/hicolor/scalable/apps/cz.douby.DoubyCommander.svg", dest = "/usr/share/icons/hicolor/scalable/apps/cz.douby.DoubyCommander.svg", mode = "644" },
    { source = "../../target/stage/usr/share/locale/cs/LC_MESSAGES/doubycmd.mo", dest = "/usr/share/locale/cs/LC_MESSAGES/doubycmd.mo", mode = "644" },
]

[package.metadata.generate-rpm.requires]
gtk4 = ">= 4.16"
libadwaita = ">= 1.6"
glibc = ">= 2.41"

[build-dependencies]
glib-build-tools.workspace = true

[lints]
workspace = true
