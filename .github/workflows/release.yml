# Builds the packages and publishes a GitHub release when a version tag
# (v0.0.2, ...) is pushed. Nothing runs on ordinary pushes.
#
# Built in Debian 13, the oldest system with libadwaita 1.6 (CSS variables),
# so the binaries need GTK 4.16, libadwaita 1.6 and glibc 2.41 or newer:
# Arch, Fedora 42+, Debian 13, Ubuntu 25.04 and later.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git jq gh \
            build-essential pkg-config libgtk-4-dev libadwaita-1-dev libarchive-dev libvte-2.91-gtk4-dev gettext desktop-file-utils

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Packaging tools
        run: cargo install --locked cargo-deb cargo-generate-rpm

      - name: Tag matches the version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "dc-gui") | .version')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME, but Cargo.toml says $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked

      - name: Packages
        run: |
          DESTDIR=target/stage PREFIX=/usr ./install.sh --no-build
          cargo deb -p dc-gui --no-build
          cargo generate-rpm -p crates/dc-gui

          # The tarball is a prefix tree for /usr/local or ~/.local, owned by
          # root and without its top directory, so that extracting it does not
          # touch the prefix itself. Its launcher finds the program on the PATH.
          DESTDIR=target/tarball PREFIX=/usr/local ./install.sh --no-build
          install -Dm644 -t target/tarball/usr/local/share/applications extras/linux/cz.douby.DoubyCommander.desktop
          install -Dm644 -t target/tarball/usr/local/share/doc/douby-commander README.md LICENSE.md
          mkdir -p dist
          tar -czf "dist/douby-commander-$VERSION-x86_64-linux.tar.gz" --owner=0 --group=0 --numeric-owner \
            -C target/tarball/usr/local bin share
          cp target/debian/*.deb target/generate-rpm/*.rpm dist/
          ls -l dist

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Alpha version, many features are not done yet. See the README.

          Install (x86_64, needs GTK 4.16, libadwaita 1.6 and glibc 2.41 or newer):

          - Debian, Ubuntu: \`sudo apt install ./douby-commander_$VERSION-1_amd64.deb\`
          - Fedora, RHEL and derivatives: \`sudo dnf install ./douby-commander-$VERSION-1.x86_64.rpm\`
          - Arch and others: \`tar -xzf douby-commander-$VERSION-x86_64-linux.tar.gz -C ~/.local\`
            (or \`sudo tar ... -C /usr/local\` for all users)
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Douby Commander $VERSION" --notes-file notes.md --prerelease
